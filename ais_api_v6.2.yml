openapi: '3.0.3'
info:
  title: AI Studio Public API
  version: '6.2'
servers:
  - url: https://example.com/genai-api
paths:
  /v2/upload:
    post:
      summary: Add or update a media asset with optional metadata. If an asset with the same ext_id already exists, it will be updated with the new information and the existing media_id will be returned.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - master
              properties:
                master:
                  $ref: '#/components/schemas/MediaAsset'
                proxy:
                  $ref: '#/components/schemas/MediaAsset'
                metadata:
                  type: array
                  items:
                    type: object
                    properties:
                      language:
                        type: string
                        example: en_CA
                      title:
                        type: string
                      description:
                        type: string
            examples:
              with_media_profile:
                summary: Upload using inline media profile
                value:
                  master:
                    ext_id: asset-001
                    uri: s3://bucket/media/video.mxf
                    media_profile:
                      - group_type: video
                        track_info:
                          codec: AVC
                          bitRate: 50000000
                          frameRate:
                            numerator: 30000
                            denominator: 1001
                          frameSize:
                            width: 1920
                            height: 1080
                      - group_type: audio
                        audio_kind: PRM
                        audio_group: ST
                        language: en-US
                        track_info:
                          codec: PCM-24
                          bitRate: 2304000
                          sampleRate: 48000
                        channel_layouts:
                          - channel_locator: "1"
                            audio_channel: L
                          - channel_locator: "2"
                            audio_channel: R
                      - group_type: cc
                        format: CEA-608
                        language: en-US
                  metadata:
                    - language: en-US
                      title: Sample Video
                      description: A sample media asset
              with_media_profile_name:
                summary: Upload using a pre-configured media profile
                value:
                  master:
                    ext_id: asset-002
                    uri: s3://bucket/media/video.mxf
                    media_profile_name: HD-1080p-Stereo
                  proxy:
                    ext_id: asset-002-proxy
                    uri: s3://bucket/media/video_proxy.mp4
                    media_profile_name: Proxy-720p
                  metadata:
                    - language: en-US
                      title: Sample Video
                      description: A sample media asset
      responses:
        '200':
          description: Media asset already exists, returning existing asset information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '201':
          description: Media asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid or Expired API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Permission Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v2/smart-crop:
    post:
      summary: Generate Video from a sequence of media assets and export to destination based on a predefined export template. The media assets in the sequence must have already been added to the system via the /v2/upload endpoint.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sequence
                - ext_job_id
              properties:
                ext_job_id:
                  type: string
                  description: External Job ID
                sequence:
                  type: array
                  items:
                    type: object
                    required:
                      - ext_id
                    properties:
                      ext_id:
                        type: string
                        description: Identifier for the Media Asset in the external MAM / DAM system
                      start_timecode:
                        type: string
                        description: Start timecode for the clip
                      end_timecode:
                        type: string
                        description: End timecode for the clip
                export_template_name:
                  type: string
                  description: Name of the export template to apply
      responses:
        '202':
          description: Job accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: Unique identifier for the created job
                    example: 1015825c-7c90-4042-8513-24585fb9c235
        '400':
          description: Invalid or Expired API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Missing API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Permission Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v2/status:
    post:
      summary: Get the status of one or more jobs
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required:
                    - job_id
                  properties:
                    job_id:
                      type: array
                      items:
                        type: string
                      description: List of AI Studio job IDs to retrieve status for
                  not:
                    required:
                      - ext_job_id
                - required:
                    - ext_job_id
                  properties:
                    ext_job_id:
                      type: array
                      items:
                        type: string
                      description: List of external job IDs to retrieve status for
                  not:
                    required:
                      - job_id
            examples:
              by_job_id:
                summary: Query by AI Studio job IDs
                value:
                  job_id:
                    - 1015825c-7c90-4042-8513-24585fb9c235
                    - 2a3b4c5d-1234-5678-abcd-ef0123456789
              by_ext_job_id:
                summary: Query by external job IDs
                value:
                  ext_job_id:
                    - ext-job-001
                    - ext-job-002
      responses:
        '200':
          description: Job status retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobStatus'
              examples:
                queued:
                  summary: Job is queued
                  value:
                    - job_id: 1015825c-7c90-4042-8513-24585fb9c235
                      ext_job_id: ext-job-001
                      status: Queued
                      progress_percent: 0
                processing:
                  summary: Job is processing
                  value:
                    - job_id: 2a3b4c5d-1234-5678-abcd-ef0123456789
                      ext_job_id: ext-job-002
                      status: Processing
                      progress_percent: 45
                completed:
                  summary: Job completed successfully
                  value:
                    - job_id: 3c4d5e6f-2345-6789-bcde-f01234567890
                      ext_job_id: ext-job-003
                      status: Completed
                      progress_percent: 100
                      media_assets:
                        - uri: s3://bucket/output/file.mp4
                          asset_type: video
                        - uri: s3://bucket/output/file_proxy.mp4
                          asset_type: proxy
                failed:
                  summary: Job failed
                  value:
                    - job_id: 4d5e6f7a-3456-789a-cdef-012345678901
                      ext_job_id: ext-job-004
                      status: Failed
                      progress_percent: 30
                      error:
                        code: 400342
                        message: Invalid Video
        '400':
          description: Invalid or Expired API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Missing API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Permission Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'

components:
  schemas:
    MediaAsset:
      allOf:
        - type: object
          required:
            - ext_id
            - uri
          properties:
            ext_id:
              type: string
              description: Identifier for the Media Asset in the external MAM / DAM system
            uri:
              type: string
              description: "Location of the Media Asset. Supported schemes include: https, s3, gcs"
        - oneOf:
            - required:
                - media_profile
              properties:
                media_profile:
                  type: array
                  description: Media asset profile defining the structure of the media file. If media_profile_name is not provided, this profile will be applied to the Media Asset
                  items:
                    $ref: '#/components/schemas/MediaProfileTrack'
              not:
                required:
                  - media_profile_name
            - required:
                - media_profile_name
              properties:
                media_profile_name:
                  type: string
                  description: Name of a pre-configured media profile to apply to the Media Asset
              not:
                required:
                  - media_profile
    MediaProfileTrack:
      oneOf:
        - $ref: '#/components/schemas/VideoTrack'
        - $ref: '#/components/schemas/AudioTrack'
        - $ref: '#/components/schemas/CCTrack'
      discriminator:
        propertyName: group_type
        mapping:
          video: '#/components/schemas/VideoTrack'
          audio: '#/components/schemas/AudioTrack'
          cc: '#/components/schemas/CCTrack'
    VideoTrack:
      type: object
      required:
        - group_type
      properties:
        group_type:
          type: string
          enum:
            - video
        track_info:
          type: object
          properties:
            codec:
              type: string
              enum:
                - AVC
                - HEVC
                - MPEG-4 Part 2
                - Apple ProRes 422
                - AVC-Intra
                - JPEG2000
            bitRate:
              type: integer
              description: Bit rate in bits per second
            frameRate:
              type: object
              description: Frame rate as a rational number
              properties:
                numerator:
                  type: integer
                denominator:
                  type: integer
            frameSize:
              type: object
              description: Frame dimensions
              properties:
                width:
                  type: integer
                height:
                  type: integer
    AudioTrack:
      type: object
      required:
        - group_type
      properties:
        group_type:
          type: string
          enum:
            - audio
        audio_kind:
          type: string
          enum:
            - PRM
            - SAP
            - HI
            - DV
            - DX
            - MX
            - FX
            - FFX
            - ME
            - OP
            - MESP
            - DME
            - NDME
            - PNAR
            - ONAR
            - VO
            - VI
            - CM
            - LCM
            - MOS
        audio_group:
          type: string
          enum:
            - ST
            - DM
            - LtRt
            - DNS
            - "3.0"
            - "4.0"
            - "5.0"
            - "5.1"
            - "5.1EX"
            - "6.0"
            - "6.1"
            - "7.0DS"
            - "7.1DS"
            - "7.1SDS"
            - "HA"
            - "VA"
        language:
          type: string
          description: Language code (e.g. en-US)
          example: en-US
        track_info:
          type: object
          properties:
            codec:
              type: string
              enum:
                - AAC
                - AC3
                - EAC3
                - FLAC
                - PCM-16
                - PCM-24
            bitRate:
              type: integer
              description: Bit rate in bits per second
            sampleRate:
              type: integer
              description: Sample rate in Hz
        channel_layouts:
          type: array
          items:
            type: object
            required:
              - channel_locator
            properties:
              channel_locator:
                type: string
                description: Locator identifying the channel within the asset
              audio_channel:
                type: string
                enum:
                  - L
                  - R
                  - C
                  - LFE
                  - Ls
                  - Rs
                  - Lss
                  - Rss
                  - Lrs
                  - Rrs
                  - Lc
                  - Rc
                  - Cs
                  - HI
                  - VIN
                  - Lt
                  - Rt
                  - Lst
                  - Rst
                  - S
                  - M1
                  - M2
    CCTrack:
      type: object
      required:
        - group_type
      properties:
        group_type:
          type: string
          enum:
            - cc
        format:
          type: string
          enum:
            - CEA-608
            - EIA-608
            - CEA-708
            - EIA-708
        language:
          type: string
          description: Language code (e.g. en-US)
          example: en-US
    UploadResponse:
      type: object
      properties:
        job_id:
          type: string
          description: AI Studio Job Identifier for the Upload operation. This can be used to query the status of the upload processing via the /status endpoint.
        ext_id:
          type: string
          description: Identifier for the Media Asset in the external MAM / DAM system
        uri:
          type: string
          description: Location of the uploaded Media Asset
        media_id:
          type: string
          description: Internal identifier assigned to the Media Asset
        duration:
          type: integer
          description: Duration of the Media Asset in milliseconds
        mimeType:
          type: string
          description: MIME type of the Media Asset
        status:
          type: string
          description: Processing status of the Media Asset
    JobStatus:
      type: object
      description: Status of the requested job
      properties:
        job_id:
          type: string
          description: AI Studio Job ID
        ext_job_id:
          type: string
          description: External Job ID
        status:
          type: string
          description: Current status of the job
          enum:
            - Queued
            - Processing
            - Completed
            - Failed
        progress_percent:
          type: integer
          description: Job completion percentage
          minimum: 0
          maximum: 100
      oneOf:
        - description: Completed job — includes output asset details
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - Completed
            media_assets:
              type: array
              description: Output assets produced by the completed job
              items:
                type: object
                properties:
                  uri:
                    type: string
                    description: Location of the output asset
                  asset_type:
                    type: string
                    description: Type of the output asset
        - description: In-progress job
          properties:
            status:
              type: string
              enum:
                - Queued
                - Processing
        - description: Failed job — includes error details
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - Failed
            error:
              type: object
              properties:
                code:
                  type: integer
                  description: Error code
                message:
                  type: string
                  description: Error message
    ForbiddenResponse:
      type: object
      properties:
        message:
          type: string
          example: "PERMISSION_DENIED: The API targeted by this request is invalid for the given API key."
        code:
          type: integer
          example: 403
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
          example: "UNAUTHENTICATED: Method doesn't allow unregistered callers"
        code:
          type: integer
          example: 401
    BadRequestResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              example: 400
            message:
              type: string
              example: API key not valid. Please pass a valid API key.
            status:
              type: string
              example: INVALID_ARGUMENT
            details:
              type: array
              items:
                type: object
                properties:
                  "@type":
                    type: string
                    example: type.googleapis.com/google.rpc.ErrorInfo
                  reason:
                    type: string
                    example: API_KEY_INVALID
                  domain:
                    type: string
                    example: googleapis.com
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
