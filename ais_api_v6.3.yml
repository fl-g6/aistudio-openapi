openapi: '3.0.3'
info:
  title: AI Studio Public API
  version: '6.3'
servers:
  - url: https://verticalizer.videoai.wbd.com/genai-api
paths:
  /v2/upload:
    post:
      summary: Add or update a media asset with optional metadata. If an asset with the same ext_id already exists, it will be updated with the new information and the existing media_id will be returned.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - master
              properties:
                master:
                  $ref: '#/components/schemas/MediaAsset'
                proxy:
                  $ref: '#/components/schemas/MediaAsset'
                priority:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  default: 0
                  description: Processing priority. 0 is lowest priority, 1000 is highest priority. Jobs are processed based on this priority and the request time (earlier requests win within the same priority).
                email:
                  type: string
                  format: email
                  description: Email address of the requesting user.
                ai_flags:
                  description: |
                    AI processing flags to apply to the uploaded asset. When provided, the request is processed asynchronously and the API returns HTTP 202 Accepted with a job_id that can be polled via /v2/status.

                    Allowed combinations (exactly one of):
                      1. [AUTO_GENERATE_ALL] by itself
                      2. [AUTO_GENERATE_DEFAULT] by itself
                      3. Any non-empty subset of {AUTO_GENERATE_SOURCE_METADATA, AUTO_DETECT_SCENES}

                    AUTO_GENERATE_ALL and AUTO_GENERATE_DEFAULT are mutually exclusive with each other and with the granular flags (AUTO_GENERATE_SOURCE_METADATA, AUTO_DETECT_SCENES).
                  oneOf:
                    - title: AUTO_GENERATE_ALL only
                      type: array
                      minItems: 1
                      maxItems: 1
                      items:
                        type: string
                        enum:
                          - AUTO_GENERATE_ALL
                    - title: AUTO_GENERATE_DEFAULT only
                      type: array
                      minItems: 1
                      maxItems: 1
                      items:
                        type: string
                        enum:
                          - AUTO_GENERATE_DEFAULT
                    - title: Granular flags
                      type: array
                      minItems: 1
                      maxItems: 2
                      uniqueItems: true
                      items:
                        type: string
                        enum:
                          - AUTO_GENERATE_SOURCE_METADATA
                          - AUTO_DETECT_SCENES
                metadata:
                  type: array
                  items:
                    type: object
                    properties:
                      language:
                        type: string
                        example: en_CA
                      title:
                        type: string
                      description:
                        type: string
            examples:
              with_media_profile:
                summary: Upload using inline media profile
                value:
                  master:
                    ext_id: asset-001
                    uri: s3://bucket/media/video.mxf
                    media_profile:
                      - group_type: video
                        track_info:
                          codec: AVC
                          bitRate: 50000000
                          frameRate:
                            numerator: 30000
                            denominator: 1001
                          frameSize:
                            width: 1920
                            height: 1080
                      - group_type: audio
                        audio_kind: PRM
                        audio_group: ST
                        language: en-US
                        track_info:
                          codec: PCM-24
                          bitRate: 2304000
                          sampleRate: 48000
                        channel_layouts:
                          - channel_locator: "1"
                            audio_channel: L
                          - channel_locator: "2"
                            audio_channel: R
                      - group_type: cc
                        format: CEA-608
                        language: en-US
                  proxy:
                    ext_id: asset-001-proxy
                    uri: s3://bucket/media/video_proxy.mp4
                    media_profile:
                      - group_type: video
                        track_info:
                          codec: AVC
                          bitRate: 5000000
                          frameRate:
                            numerator: 30000
                            denominator: 1001
                          frameSize:
                            width: 1280
                            height: 720
                      - group_type: audio
                        audio_kind: PRM
                        audio_group: ST
                        language: en-US
                        track_info:
                          codec: AAC
                          bitRate: 192000
                          sampleRate: 48000
                        channel_layouts:
                          - channel_locator: "1"
                            audio_channel: L
                          - channel_locator: "2"
                            audio_channel: R
                  metadata:
                    - language: en-US
                      title: Sample Video
                      description: A sample media asset
              with_media_profile_name:
                summary: Upload using a pre-configured media profile
                value:
                  master:
                    ext_id: asset-002
                    uri: s3://bucket/media/video.mxf
                    media_profile_name: HD-1080p-Stereo
                  proxy:
                    ext_id: asset-002-proxy
                    uri: s3://bucket/media/video_proxy.mp4
                    media_profile_name: Proxy-720p
                  metadata:
                    - language: en-US
                      title: Sample Video
                      description: A sample media asset
              with_ai_flags:
                summary: Async upload with AI processing flags (returns 202)
                value:
                  master:
                    ext_id: asset-003
                    uri: s3://bucket/media/video.mxf
                    media_profile_name: HD-1080p-Stereo
                  proxy:
                    ext_id: asset-003-proxy
                    uri: s3://bucket/media/video_proxy.mp4
                    media_profile_name: Proxy-720p
                  priority: 500
                  email: producer@example.com
                  ai_flags:
                    - AUTO_GENERATE_SOURCE_METADATA
                    - AUTO_DETECT_SCENES
                  metadata:
                    - language: en-US
                      title: Sample Video
                      description: A sample media asset
      responses:
        '200':
          description: Media asset already exists, returning existing asset information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '201':
          description: Media asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '202':
          description: Asynchronous upload accepted. Returned when ai_flags is provided. Poll /v2/status with the returned job_id to track progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: AI Studio Job ID. Use this to poll /v2/status.
                    example: 1015825c-7c90-4042-8513-24585fb9c235
                  status:
                    type: string
                    enum:
                      - Queued
                    example: Queued
        '400':
          description: Invalid or Expired API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Permission Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v3/upload:
    post:
      summary: Add or update a media asset group with optional metadata. Similar to /v2/upload, but master and proxy are arrays so a single upload can register multiple master and proxy assets together (e.g. multi-track or multi-rendition deliveries).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - master
              properties:
                master:
                  $ref: '#/components/schemas/MediaAssetV3Group'
                proxy:
                  $ref: '#/components/schemas/MediaAssetV3Group'
                priority:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  default: 0
                  description: Processing priority. 0 is lowest priority, 1000 is highest priority. Jobs are processed based on this priority and the request time (earlier requests win within the same priority).
                email:
                  type: string
                  format: email
                  description: Email address of the requesting user.
                ai_flags:
                  description: |
                    AI processing flags to apply to the uploaded assets. When provided, the request is processed asynchronously and the API returns HTTP 202 Accepted with a job_id that can be polled via /v2/status.

                    Allowed combinations (exactly one of):
                      1. [AUTO_GENERATE_ALL] by itself
                      2. [AUTO_GENERATE_DEFAULT] by itself
                      3. Any non-empty subset of {AUTO_GENERATE_SOURCE_METADATA, AUTO_DETECT_SCENES}

                    AUTO_GENERATE_ALL and AUTO_GENERATE_DEFAULT are mutually exclusive with each other and with the granular flags (AUTO_GENERATE_SOURCE_METADATA, AUTO_DETECT_SCENES).
                  oneOf:
                    - title: AUTO_GENERATE_ALL only
                      type: array
                      minItems: 1
                      maxItems: 1
                      items:
                        type: string
                        enum:
                          - AUTO_GENERATE_ALL
                    - title: AUTO_GENERATE_DEFAULT only
                      type: array
                      minItems: 1
                      maxItems: 1
                      items:
                        type: string
                        enum:
                          - AUTO_GENERATE_DEFAULT
                    - title: Granular flags
                      type: array
                      minItems: 1
                      maxItems: 2
                      uniqueItems: true
                      items:
                        type: string
                        enum:
                          - AUTO_GENERATE_SOURCE_METADATA
                          - AUTO_DETECT_SCENES
                metadata:
                  type: array
                  items:
                    type: object
                    properties:
                      language:
                        type: string
                        example: en_CA
                      title:
                        type: string
                      description:
                        type: string
            examples:
              master_only:
                summary: Single master, no proxy
                value:
                  master:
                    ext_id: asset-group-003
                    media_assets:
                      - ext_asset_id: master-video-003
                        uri: s3://bucket/media/video.mxf
                        media_profile:
                          - group_type: video
                            track_info:
                              codec: AVC
                              bitRate: 50000000
                              frameRate:
                                numerator: 30000
                                denominator: 1001
                              frameSize:
                                width: 1920
                                height: 1080
                  priority: 500
                  email: producer@example.com
                  metadata:
                    - language: en-US
                      title: Sample Video
                      description: A master-only upload
              multi_master_with_proxies:
                summary: Multiple master assets with corresponding proxies
                value:
                  master:
                    ext_id: asset-group-001
                    media_assets:
                      - ext_asset_id: master-video-001
                        uri: s3://bucket/media/video.mxf
                        media_profile:
                          - group_type: video
                            track_info:
                              codec: AVC
                              bitRate: 50000000
                              frameRate:
                                numerator: 30000
                                denominator: 1001
                              frameSize:
                                width: 1920
                                height: 1080
                      - ext_asset_id: master-audio-001
                        uri: s3://bucket/media/audio.wav
                        media_profile:
                          - group_type: audio
                            audio_kind: PRM
                            audio_group: ST
                            language: en-US
                            track_info:
                              codec: PCM-24
                              bitRate: 2304000
                              sampleRate: 48000
                            channel_layouts:
                              - channel_locator: "1"
                                audio_channel: L
                              - channel_locator: "2"
                                audio_channel: R
                  proxy:
                    ext_id: asset-group-001-proxy
                    media_assets:
                      - ext_asset_id: proxy-video-001
                        uri: s3://bucket/media/video_proxy.mp4
                        media_profile:
                          - group_type: video
                            track_info:
                              codec: AVC
                              bitRate: 5000000
                              frameRate:
                                numerator: 30000
                                denominator: 1001
                              frameSize:
                                width: 1280
                                height: 720
                  priority: 500
                  email: producer@example.com
                  metadata:
                    - language: en-US
                      title: Sample Video
                      description: A sample multi-asset upload
              with_ai_flags:
                summary: Async multi-asset upload with AI processing flags (returns 202)
                value:
                  master:
                    ext_id: asset-group-002
                    media_assets:
                      - ext_asset_id: master-video-002
                        uri: s3://bucket/media/video.mxf
                        media_profile:
                          - group_type: video
                            track_info:
                              codec: AVC
                              bitRate: 50000000
                              frameRate:
                                numerator: 30000
                                denominator: 1001
                              frameSize:
                                width: 1920
                                height: 1080
                  proxy:
                    ext_id: asset-group-002-proxy
                    media_assets:
                      - ext_asset_id: proxy-video-002
                        uri: s3://bucket/media/video_proxy.mp4
                        media_profile:
                          - group_type: video
                            track_info:
                              codec: AVC
                              bitRate: 5000000
                              frameRate:
                                numerator: 30000
                                denominator: 1001
                              frameSize:
                                width: 1280
                                height: 720
                  ai_flags:
                    - AUTO_GENERATE_SOURCE_METADATA
                    - AUTO_DETECT_SCENES
                  metadata:
                    - language: en-US
                      title: Sample Video
                      description: A sample multi-asset upload
      responses:
        '200':
          description: Asset group already exists, returning existing asset information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '201':
          description: Asset group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '202':
          description: Asynchronous upload accepted. Returned when ai_flags is provided. Poll /v2/status with the returned job_id to track progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: AI Studio Job ID. Use this to poll /v2/status.
                    example: 1015825c-7c90-4042-8513-24585fb9c235
                  status:
                    type: string
                    enum:
                      - Queued
                    example: Queued
        '400':
          description: Invalid or Expired API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Permission Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v2/smart-crop:
    post:
      summary: Generate Video from a sequence of media assets and export to destination based on a predefined export template. The media assets in the sequence must have already been added to the system via the /v2/upload endpoint.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sequence
                - ext_job_id
              properties:
                ext_job_id:
                  type: string
                  description: External Job ID
                sequence:
                  type: array
                  items:
                    type: object
                    required:
                      - ext_id
                    properties:
                      ext_id:
                        type: string
                        description: Identifier for the Media Asset in the external MAM / DAM system. This must be the ext_id of the master asset (not the proxy) previously registered via /v2/upload.
                      start_timecode:
                        type: string
                        description: Start timecode for the clip
                      end_timecode:
                        type: string
                        description: End timecode for the clip
                export_template_name:
                  type: array
                  items:
                    type: string
                  description: Names of the export templates to apply
                priority:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  default: 0
                  description: Processing priority. 0 is lowest priority, 1000 is highest priority. Jobs are processed based on this priority and the request time (earlier requests win within the same priority).
                email:
                  type: string
                  format: email
                  description: Email address of the requesting user.
      responses:
        '202':
          description: Job accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: Unique identifier for the created job
                    example: 1015825c-7c90-4042-8513-24585fb9c235
        '400':
          description: Invalid or Expired API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Missing API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Permission Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /v2/smart-crop/{ext_job_id}/publish:
    post:
      summary: Publish (render and export) the result of an existing smart-crop job using one or more export templates. The smart-crop job referenced by ext_job_id must have been created via /v2/smart-crop.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: ext_job_id
          in: path
          required: true
          description: External Job ID of the smart-crop job to publish. Must match the ext_job_id used when the job was created via /v2/smart-crop.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - export_template_name
              properties:
                export_template_name:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: Names of the export templates to render and export. The video is rendered once per template.
                priority:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  default: 0
                  description: Processing priority. 0 is lowest priority, 1000 is highest priority. Jobs are processed based on this priority and the request time (earlier requests win within the same priority).
                email:
                  type: string
                  format: email
                  description: Email address of the requesting user.
            examples:
              publish_single_template:
                summary: Publish using a single export template
                value:
                  export_template_name:
                    - HD-1080p-Stereo
                  priority: 500
                  email: producer@example.com
              publish_multiple_templates:
                summary: Publish using multiple export templates
                value:
                  export_template_name:
                    - HD-1080p-Stereo
                    - Proxy-720p
                  priority: 0
                  email: producer@example.com
      responses:
        '202':
          description: Publish job accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                    description: Unique identifier for the publish job. Use this to poll /v2/status.
                    example: 1015825c-7c90-4042-8513-24585fb9c235
        '400':
          description: Invalid or Expired API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Missing API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Permission Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
        '404':
          description: Smart-crop job with the given ext_job_id was not found
  /v2/status:
    post:
      summary: Get the status of one or more jobs
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required:
                    - job_id
                  properties:
                    job_id:
                      type: array
                      items:
                        type: string
                      description: List of AI Studio job IDs to retrieve status for
                  not:
                    required:
                      - ext_job_id
                - required:
                    - ext_job_id
                  properties:
                    ext_job_id:
                      type: array
                      items:
                        type: string
                      description: List of external job IDs to retrieve status for
                  not:
                    required:
                      - job_id
            examples:
              by_job_id:
                summary: Query by AI Studio job IDs
                value:
                  job_id:
                    - 1015825c-7c90-4042-8513-24585fb9c235
                    - 2a3b4c5d-1234-5678-abcd-ef0123456789
              by_ext_job_id:
                summary: Query by external job IDs
                value:
                  ext_job_id:
                    - ext-job-001
                    - ext-job-002
      responses:
        '200':
          description: Job status retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobStatus'
              examples:
                queued:
                  summary: Job is queued
                  value:
                    - job_id: 1015825c-7c90-4042-8513-24585fb9c235
                      ext_job_id: ext-job-001
                      status: Queued
                      progress_percent: 0
                processing:
                  summary: Job is processing
                  value:
                    - job_id: 2a3b4c5d-1234-5678-abcd-ef0123456789
                      ext_job_id: ext-job-002
                      status: Processing
                      progress_percent: 45
                completed:
                  summary: Job completed successfully
                  value:
                    - job_id: 3c4d5e6f-2345-6789-bcde-f01234567890
                      ext_job_id: ext-job-003
                      status: Completed
                      progress_percent: 100
                      media_assets:
                        - uri: s3://bucket/output/file.mp4
                          asset_type: video
                        - uri: s3://bucket/output/file_proxy.mp4
                          asset_type: proxy
                failed:
                  summary: Job failed
                  value:
                    - job_id: 4d5e6f7a-3456-789a-cdef-012345678901
                      ext_job_id: ext-job-004
                      status: Failed
                      progress_percent: 30
                      error:
                        code: 400342
                        message: Invalid Video
        '400':
          description: Invalid or Expired API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Missing API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Permission Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'

components:
  schemas:
    MediaAsset:
      allOf:
        - type: object
          required:
            - ext_id
            - uri
          properties:
            ext_id:
              type: string
              description: Identifier for the Media Asset in the external MAM / DAM system
            uri:
              type: string
              description: "Location of the Media Asset. Supported schemes include: https, s3, gcs"
        - oneOf:
            - required:
                - media_profile
              properties:
                media_profile:
                  type: array
                  description: Media asset profile defining the structure of the media file. If media_profile_name is not provided, this profile will be applied to the Media Asset
                  items:
                    $ref: '#/components/schemas/MediaProfileTrack'
              not:
                required:
                  - media_profile_name
            - required:
                - media_profile_name
              properties:
                media_profile_name:
                  type: string
                  description: Name of a pre-configured media profile to apply to the Media Asset
              not:
                required:
                  - media_profile
    MediaAssetV3Group:
      type: object
      required:
        - ext_id
        - media_assets
      properties:
        ext_id:
          type: string
          description: Identifier for this asset group in the external MAM / DAM system.
        media_assets:
          type: array
          minItems: 1
          description: One or more media assets that make up this group.
          items:
            $ref: '#/components/schemas/MediaAssetV3Item'
    MediaAssetV3Item:
      type: object
      required:
        - ext_asset_id
        - uri
        - media_profile
      properties:
        ext_asset_id:
          type: string
          description: Identifier for the Media Asset within this upload group.
        uri:
          type: string
          description: "Location of the Media Asset. Supported schemes include: https, s3, gcs"
        media_profile:
          type: array
          description: Media asset profile defining the structure of the media file.
          items:
            $ref: '#/components/schemas/MediaProfileTrack'
    MediaProfileTrack:
      oneOf:
        - $ref: '#/components/schemas/VideoTrack'
        - $ref: '#/components/schemas/AudioTrack'
        - $ref: '#/components/schemas/CCTrack'
      discriminator:
        propertyName: group_type
        mapping:
          video: '#/components/schemas/VideoTrack'
          audio: '#/components/schemas/AudioTrack'
          cc: '#/components/schemas/CCTrack'
    VideoTrack:
      type: object
      required:
        - group_type
      properties:
        group_type:
          type: string
          enum:
            - video
        track_info:
          type: object
          properties:
            codec:
              type: string
              enum:
                - AVC
                - HEVC
                - MPEG-4 Part 2
                - Apple ProRes 422
                - AVC-Intra
                - JPEG2000
            bitRate:
              type: integer
              description: Bit rate in bits per second
            frameRate:
              type: object
              description: Frame rate as a rational number
              properties:
                numerator:
                  type: integer
                denominator:
                  type: integer
            frameSize:
              type: object
              description: Frame dimensions
              properties:
                width:
                  type: integer
                height:
                  type: integer
    AudioTrack:
      type: object
      required:
        - group_type
      properties:
        group_type:
          type: string
          enum:
            - audio
        audio_kind:
          type: string
          enum:
            - PRM
            - SAP
            - HI
            - DV
            - DX
            - MX
            - FX
            - FFX
            - ME
            - OP
            - MESP
            - DME
            - NDME
            - PNAR
            - ONAR
            - VO
            - VI
            - CM
            - LCM
            - MOS
        audio_group:
          type: string
          enum:
            - ST
            - DM
            - LtRt
            - DNS
            - "3.0"
            - "4.0"
            - "5.0"
            - "5.1"
            - "5.1EX"
            - "6.0"
            - "6.1"
            - "7.0DS"
            - "7.1DS"
            - "7.1SDS"
            - "HA"
            - "VA"
        language:
          type: string
          description: Language code (e.g. en-US)
          example: en-US
        track_info:
          type: object
          properties:
            codec:
              type: string
              enum:
                - AAC
                - AC3
                - EAC3
                - FLAC
                - PCM-16
                - PCM-24
            bitRate:
              type: integer
              description: Bit rate in bits per second
            sampleRate:
              type: integer
              description: Sample rate in Hz
        channel_layouts:
          type: array
          items:
            type: object
            required:
              - channel_locator
            properties:
              channel_locator:
                type: string
                description: Locator identifying the channel within the asset
              audio_channel:
                type: string
                enum:
                  - L
                  - R
                  - C
                  - LFE
                  - Ls
                  - Rs
                  - Lss
                  - Rss
                  - Lrs
                  - Rrs
                  - Lc
                  - Rc
                  - Cs
                  - HI
                  - VIN
                  - Lt
                  - Rt
                  - Lst
                  - Rst
                  - S
                  - M1
                  - M2
    CCTrack:
      type: object
      required:
        - group_type
      properties:
        group_type:
          type: string
          enum:
            - cc
        format:
          type: string
          enum:
            - CEA-608
            - EIA-608
            - CEA-708
            - EIA-708
        language:
          type: string
          description: Language code (e.g. en-US)
          example: en-US
    UploadResponse:
      type: object
      properties:
        job_id:
          type: string
          description: AI Studio Job Identifier for the Upload operation. This can be used to query the status of the upload processing via the /status endpoint.
        ext_id:
          type: string
          description: Identifier for the Media Asset in the external MAM / DAM system
        uri:
          type: string
          description: Location of the uploaded Media Asset
        media_id:
          type: string
          description: Internal identifier assigned to the Media Asset
        duration:
          type: integer
          description: Duration of the Media Asset in milliseconds
        mimeType:
          type: string
          description: MIME type of the Media Asset
        status:
          type: string
          description: Processing status of the Media Asset
    JobStatus:
      type: object
      description: Status of the requested job
      properties:
        job_id:
          type: string
          description: AI Studio Job ID
        ext_job_id:
          type: string
          description: External Job ID
        status:
          type: string
          description: Current status of the job
          enum:
            - Queued
            - Processing
            - Completed
            - Failed
        progress_percent:
          type: integer
          description: Job completion percentage
          minimum: 0
          maximum: 100
      oneOf:
        - description: Completed job — includes output asset details
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - Completed
            media_assets:
              type: array
              description: Output assets produced by the completed job
              items:
                type: object
                properties:
                  uri:
                    type: string
                    description: Location of the output asset
                  asset_type:
                    type: string
                    description: Type of the output asset
        - description: In-progress job
          properties:
            status:
              type: string
              enum:
                - Queued
                - Processing
        - description: Failed job — includes error details
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - Failed
            error:
              type: object
              properties:
                code:
                  type: integer
                  description: Error code
                message:
                  type: string
                  description: Error message
    ForbiddenResponse:
      type: object
      properties:
        message:
          type: string
          example: "PERMISSION_DENIED: The API targeted by this request is invalid for the given API key."
        code:
          type: integer
          example: 403
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
          example: "UNAUTHENTICATED: Method doesn't allow unregistered callers"
        code:
          type: integer
          example: 401
    BadRequestResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              example: 400
            message:
              type: string
              example: API key not valid. Please pass a valid API key.
            status:
              type: string
              example: INVALID_ARGUMENT
            details:
              type: array
              items:
                type: object
                properties:
                  "@type":
                    type: string
                    example: type.googleapis.com/google.rpc.ErrorInfo
                  reason:
                    type: string
                    example: API_KEY_INVALID
                  domain:
                    type: string
                    example: googleapis.com
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
